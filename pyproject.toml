[project]
name = "taverncrier"
version = "1.0.0"
description = "A discord bot providing Twitch Notifications, Gamba, and other utilities."
authors = [
    {name = "Justin",email = "justin@aperturebot.science"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "betterdisco-py[performace,yaml] (>=2024.10.10,<2025.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "peewee (==4.5.3)",
    "redis (==8.1.0)",
    "pytz (==2026.5)"
]

[tool.poetry.dependencies]
betterdisco-py = { git = "https://github.com/elderlabs/BetterDisco.git", rev = "acb9652e9825ea2b79978303567c1493d68301ea" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
